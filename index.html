<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBS Operations Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
                        display: ['Syne', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --ink: #13201c;
            --line: rgba(19, 32, 28, 0.1);
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: "DM Sans", system-ui, sans-serif;
            background:
                radial-gradient(900px 420px at 8% -8%, #d8ebe4, transparent 58%),
                radial-gradient(700px 380px at 96% 0%, #e7eef2, transparent 52%),
                linear-gradient(180deg, #f7faf8 0%, #eef3f1 48%, #e8eeeb 100%);
        }

        .tool-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--line);
            box-shadow: 0 10px 28px -22px rgba(19, 32, 28, 0.45);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .tool-card:hover {
            transform: translateY(-2px);
            border-color: rgba(15, 118, 110, 0.35);
            box-shadow: 0 16px 34px -22px rgba(15, 118, 110, 0.35);
        }

        .tool-card:active {
            transform: translateY(0) scale(0.99);
        }

        @media (prefers-reduced-motion: reduce) {
            .tool-card,
            .tool-card:hover,
            .tool-card:active {
                transition: none;
                transform: none;
            }
        }
    </style>
</head>
<body class="antialiased selection:bg-teal-100 selection:text-teal-900">
    <div class="mx-auto max-w-6xl px-5 py-10 md:px-8 md:py-14">
        <header class="mb-8 md:mb-10">
            <div class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
                <div class="max-w-xl">
                    <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-teal-800">
                        Drawer Box Specialties
                    </p>
                    <h1 class="mt-2 font-display text-4xl font-bold tracking-tight text-stone-900 md:text-5xl">
                        Operations Hub
                    </h1>
                    <p class="mt-2 text-sm text-stone-600 md:text-[15px]">
                        Internal tools in one place. Open a system below.
                    </p>
                </div>

                <div class="w-full md:w-[22rem]">
                    <label class="relative block">
                        <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-stone-400">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </span>
                        <input
                            id="search"
                            type="search"
                            placeholder="Search tools"
                            aria-label="Search tools"
                            class="w-full rounded-xl border border-stone-200 bg-white/90 py-2.5 pl-10 pr-16 text-sm text-stone-900 outline-none ring-teal-600/20 placeholder:text-stone-400 focus:border-teal-600 focus:ring-4"
                        >
                        <span id="search-hotkey" class="absolute right-3 top-1/2 hidden -translate-y-1/2 rounded-md border border-stone-200 bg-stone-50 px-1.5 py-0.5 text-[10px] font-semibold text-stone-400 sm:inline">
                            Ctrl K
                        </span>
                    </label>
                    <div class="mt-2 flex items-center justify-between text-xs text-stone-500">
                        <span><span id="tool-count">—</span> tools · <span id="last-updated">…</span></span>
                        <button
                            id="refresh-button"
                            type="button"
                            class="rounded-lg px-2 py-1 font-semibold text-teal-800 transition hover:bg-teal-50"
                        >
                            Refresh
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main id="app-grid" class="grid grid-cols-2 gap-3 md:grid-cols-3 md:gap-4 xl:grid-cols-4" aria-live="polite">
            <div class="col-span-full py-16 text-center text-sm text-stone-500">Loading tools…</div>
        </main>
    </div>

    <script>
        const ORG_NAME = 'drawerboxspecialties-ops';

        /** Extra in-card links keyed by lowercase repo / app name. */
        const APP_EXTRA_LINKS = {};

        /** Vercel-hosted apps. Add future tools here. */
        const VERCEL_APPS = [
            {
                name: 'cutflow',
                title: 'CutFlow',
                description: 'Local cut-sheet organizer + HP M611 print. Opens the shop PC app only (Always On must be running).',
                url: 'http://127.0.0.1:5055',
                host: 'Local',
                cta: 'Open local',
                alongsidePages: true,
                updated_at: '2026-08-14T00:00:00.000Z'
            },
            {
                name: 'dbs-rta-quote-calculator',
                title: 'DBS RTA Quote Calculator',
                description: 'RTA cabinet quotes, Sheets sync, and built-in material requests in one app.',
                url: 'https://dbs-rta-quote-calculator.vercel.app/quote/index.html',
                host: 'Vercel',
                updated_at: '2026-07-31T00:00:00.000Z'
            },
            {
                name: 'dbs-reports',
                title: 'DBS Reports',
                description: 'Shipping, Margin Desk, and Manufacturing Desk in one hub.',
                url: 'https://dbs-shipping-report.vercel.app',
                host: 'Vercel',
                updated_at: '2026-07-29T00:00:00.000Z'
            },
            {
                name: 'allmoxy-ops-chat',
                title: 'Allmoxy Chatbot',
                description: 'Ask about orders, customers, invoices, and payments.',
                url: 'https://allmoxy-ops-chat.vercel.app',
                host: 'Vercel',
                updated_at: '2026-07-24T00:00:00.000Z'
            }
        ];

        const gridEl = document.getElementById('app-grid');
        const searchInput = document.getElementById('search');
        const searchHotkeyEl = document.getElementById('search-hotkey');
        const refreshButton = document.getElementById('refresh-button');
        const lastUpdatedEl = document.getElementById('last-updated');
        const toolCountEl = document.getElementById('tool-count');
        let allApps = [];

        const isMac = /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent || '');
        if (searchHotkeyEl) {
            searchHotkeyEl.textContent = isMac ? '⌘K' : 'Ctrl K';
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function formatAppName(name) {
            return String(name || '')
                .replace(/[-_]+/g, ' ')
                .replace(/\b\w/g, letter => letter.toUpperCase());
        }

        function formatDate(value) {
            if (!value) return '—';
            return new Date(value).toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric'
            });
        }

        function renderLoading() {
            gridEl.innerHTML = `
                <div class="col-span-full py-16 text-center text-sm text-stone-500">
                    Loading tools…
                </div>`;
        }

        function renderEmptyState(title, message) {
            gridEl.innerHTML = `
                <div class="col-span-full rounded-2xl border border-dashed border-stone-300 bg-white/70 px-6 py-14 text-center">
                    <p class="text-sm font-semibold text-stone-800">${escapeHTML(title)}</p>
                    <p class="mt-1 text-xs text-stone-500">${escapeHTML(message)}</p>
                </div>`;
        }

        function renderError() {
            toolCountEl.textContent = '0';
            gridEl.innerHTML = `
                <div class="col-span-full rounded-2xl border border-rose-200 bg-rose-50/80 px-6 py-14 text-center">
                    <p class="text-sm font-semibold text-rose-800">Could not load tools from GitHub.</p>
                    <p class="mt-1 text-xs text-rose-600/80">Check the network or rate limit, then refresh.</p>
                </div>`;
        }

        function buildAppCard(app) {
            const safeName = escapeHTML(app.title || formatAppName(app.name));
            const safeDescription = escapeHTML(app.description || 'Internal production tool.');
            const safeUpdated = escapeHTML(formatDate(app.updated_at));
            const host = app.host || 'Pages';
            const pageUrl = app.url || `https://${ORG_NAME}.github.io/${encodeURIComponent(app.name)}/`;
            const hostClass = host === 'Vercel'
                ? 'bg-teal-50 text-teal-800'
                : host === 'Local'
                    ? 'bg-amber-50 text-amber-900'
                    : 'bg-stone-100 text-stone-600';
            const ctaLabel = escapeHTML(app.cta || 'Open');
            const extraLinks = Array.isArray(app.extraLinks) ? app.extraLinks : [];
            const extraLinksHtml = extraLinks.map(link => `
                        <a href="${escapeHTML(link.url)}" target="_blank" rel="noopener noreferrer"
                           class="text-[12px] font-semibold text-teal-800 transition hover:text-teal-950 focus:outline-none focus:underline">
                            ${escapeHTML(link.label)} →
                        </a>`).join('');

            return `
                <article class="tool-card group flex min-h-[124px] flex-col rounded-2xl p-4">
                    <div class="mb-2 flex items-center justify-between gap-2">
                        <span class="rounded-md px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wider ${hostClass}">
                            ${escapeHTML(host)}
                        </span>
                        <span class="text-[10px] font-medium uppercase tracking-wider text-stone-400">
                            ${safeUpdated}
                        </span>
                    </div>
                    <h2 class="font-display text-[15px] font-bold leading-snug tracking-tight text-stone-900 transition group-hover:text-teal-800 line-clamp-2">
                        <a href="${escapeHTML(pageUrl)}" target="_blank" rel="noopener noreferrer"
                           class="focus:outline-none focus:underline">
                            ${safeName}
                        </a>
                    </h2>
                    <p class="mt-1.5 flex-1 text-[12px] leading-snug text-stone-500 line-clamp-2">
                        ${safeDescription}
                    </p>
                    <div class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1">
                        <a href="${escapeHTML(pageUrl)}" target="_blank" rel="noopener noreferrer"
                           class="text-[12px] font-semibold text-teal-800 transition hover:text-teal-950 focus:outline-none focus:underline">
                            ${ctaLabel} →
                        </a>
                        ${extraLinksHtml}
                    </div>
                </article>`;
        }

        function renderApps(apps) {
            const term = searchInput.value.trim().toLowerCase();
            const filteredApps = term
                ? apps.filter(app => {
                    const haystack = `${app.title || ''} ${app.name} ${app.description || ''}`.toLowerCase();
                    return haystack.includes(term);
                })
                : apps;

            if (apps.length === 0) {
                renderEmptyState('No tools found', 'Enable GitHub Pages or add a Vercel app in index.html.');
                return;
            }

            if (filteredApps.length === 0) {
                renderEmptyState('No matches', `Nothing matches “${term}”.`);
                return;
            }

            gridEl.innerHTML = filteredApps.map(buildAppCard).join('');
        }

        async function fetchPageApps() {
            const response = await fetch(
                `https://api.github.com/users/${ORG_NAME}/repos?sort=updated&per_page=100`,
                { headers: { Accept: 'application/vnd.github+json' } }
            );

            if (!response.ok) {
                throw new Error(`GitHub API returned ${response.status}`);
            }

            const repos = await response.json();
            const hiddenPageRepos = new Set([
                'ops-dashboard',
                'dbs-rta-quote-calculator'
            ]);

            return repos
                .filter(repo =>
                    repo.has_pages &&
                    !hiddenPageRepos.has(String(repo.name).toLowerCase())
                )
                .map(repo => {
                    const key = String(repo.name).toLowerCase();
                    return {
                        name: repo.name,
                        title: formatAppName(repo.name),
                        description: repo.description,
                        updated_at: repo.updated_at,
                        host: 'Pages',
                        url: `https://${ORG_NAME}.github.io/${encodeURIComponent(repo.name)}/`,
                        extraLinks: APP_EXTRA_LINKS[key] || []
                    };
                });
        }

        async function loadApps() {
            renderLoading();
            refreshButton.disabled = true;

            try {
                let pageApps = [];
                let githubFailed = false;

                try {
                    pageApps = await fetchPageApps();
                } catch (error) {
                    console.error(error);
                    githubFailed = true;
                }

                const pageNames = new Set(pageApps.map(app => app.name.toLowerCase()));
                const vercelApps = VERCEL_APPS.filter(app => {
                    const key = String(app.name).toLowerCase();
                    if (app.alongsidePages) return true;
                    return !pageNames.has(key);
                });

                allApps = [...vercelApps, ...pageApps]
                    .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

                // Still show Vercel tools if GitHub is down; only hard-fail when nothing is left.
                if (allApps.length === 0 && githubFailed) {
                    renderError();
                    return;
                }

                toolCountEl.textContent = String(allApps.length);
                lastUpdatedEl.textContent = new Date().toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit'
                });
                renderApps(allApps);
            } finally {
                refreshButton.disabled = false;
            }
        }

        searchInput.addEventListener('input', () => renderApps(allApps));
        refreshButton.addEventListener('click', loadApps);

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        loadApps();
    </script>
</body>
</html>
